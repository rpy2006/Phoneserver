plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yadaventerprise.phoneserver'
    compileSdk 34

    defaultConfig {
        applicationId "com.yadaventerprise.phoneserver"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Only arm64-v8a is bundled right now (that's the .so you have).
        // Once you build/download the armeabi-v7a version too, add it
        // back here: abiFilters "arm64-v8a", "armeabi-v7a"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        // Project-local debug keystore so every build (AndroidIDE, PC, any HOME)
        // signs with the same key and can update the installed app in place.
        // This is a debug-only key with the standard public password.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
